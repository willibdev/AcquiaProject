name: Deploy to Acquia (dist artifact)

on:
  workflow_dispatch:

env:
  PHP_VERSION: 8.3

jobs:
  deploy-acquia:
    runs-on: ubuntu-latest
    environment: acquia
    concurrency: acquia-deploy
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Install Acquia CLI
        run: |
          curl -fsSL https://github.com/acquia/cli/releases/latest/download/acli.phar -o acli
          chmod +x acli
          sudo mv acli /usr/local/bin/acli
          acli --version

      - name: Configure SSH for Acquia git
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACQUIA_SSH_KEY }}

      - name: Add acquia host to known_hosts
        run: ssh-keyscan -T 10 -H ${{ vars.ACQUIA_GIT_HOST }} >> ~/.ssh/known_hosts

      - name: Configure git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Build and push artifact to dist
        run: |
          acli push:artifact --dir "$GITHUB_WORKSPACE" \
            --destination-git-branch dist \
            --destination-git-urls ${{ vars.ACQUIA_GIT_URL }} \
            --no-interaction
        env:
          ACLI_KEY: ${{ secrets.ACQUIA_API_KEY_ID }}
          ACLI_SECRET: ${{ secrets.ACQUIA_API_KEY_SECRET }}

      # push:artifact only updates the `dist` branch. It does NOT deploy code to
      # the environment, so post-code-deploy Cloud Hooks (drush config:import)
      # never run. Switch the environment's code to the `dist` branch so Cloud
      # re-points dev at the new commit and executes hooks/common/post-code-deploy.
      # The switch is fired without --task-wait so the trigger returns fast; the
      # linked task notification is awaited separately, bounded by `timeout` so a
      # hung task cannot block the job forever (the deploy still runs on Acquia).
      - name: Trigger code switch to dist branch
        id: code-switch
        run: |
          acli api:environments:code-switch \
            ${{ vars.ACQUIA_APP }}.${{ vars.ACQUIA_ENV }} \
            ${{ vars.ACQUIA_BRANCH }} \
            --no-interaction \
            > code-switch-task.json
        env:
          ACLI_KEY: ${{ secrets.ACQUIA_API_KEY_ID }}
          ACLI_SECRET: ${{ secrets.ACQUIA_API_KEY_SECRET }}

      - name: Wait for code switch task to complete
        run: |
          # Wait for the Acquia task referenced by the code-switch response.
          # Bounded by `timeout` (GNU coreutils, available on ubuntu-latest) so a
          # stuck task fails the job with a clear message instead of hanging.
          timeout 1800 acli app:task-wait "$(cat code-switch-task.json)"
        env:
          ACLI_KEY: ${{ secrets.ACQUIA_API_KEY_ID }}
          ACLI_SECRET: ${{ secrets.ACQUIA_API_KEY_SECRET }}
