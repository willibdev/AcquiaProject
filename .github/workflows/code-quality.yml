name: Code quality (PHPCS & PHPStan)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PHP_VERSION: 8.3

jobs:
  run-phpcs:
    runs-on: ubuntu-latest
    # Disabling the job for Draft pull requests.
    if: github.event.pull_request.draft == false
    # Setting Github token to use Github CLI.
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Using our custom composite action to run composer checks and composer install.
      - name: composer validate and install
        uses: ./.github/actions/composer
        with:
          php_version: ${{ env.PHP_VERSION }}

      - name: Run PHPCS (Drupal Standards)
        run: |
          gh pr view ${{ github.event.number }} --json files \
            --jq '.files[] | select(.status == "added" or .status == "modified") | .path' \
            | grep -E '\.(php|module|inc|install|profile|theme|info|yml)$' \
            | xargs -r -d '\n' vendor/bin/phpcs -nq

  run-phpstan:
    runs-on: ubuntu-latest
    # Disabling the job for Draft pull requests.
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Using our custom composite action to run composer checks and composer install.
      - name: composer validate and install
        uses: ./.github/actions/composer
        with:
          php_version: ${{ env.PHP_VERSION }}

      - name: Run PHPStan analysis
        run: vendor/bin/phpstan analyse
