name: "Composer setup and validation"
description: "Validate composer.json and composer.lock, then install dependencies."

inputs:
  php_version:
    description: "PHP Version to run."
    default: "8.3"

runs:
  using: "composite"
  steps:
    - name: "Setup PHP"
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        tools: composer:v2
        extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, pdo_mysql, bcmath, gd, exif, iconv
        coverage: none

    - name: Validate the syntax of the composer.json file
      shell: bash
      run: composer validate --no-check-all --strict

    - name: Check composer.lock
      shell: bash
      run: |
        composer install --dry-run
        if [ $? -ne 0 ]; then
          echo "composer.lock is out of date. Please run 'composer update' to generate an updated lock file."
          exit 1
        fi

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-${{ inputs.php_version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-php-${{ inputs.php_version }}-composer-

    - name: Install dependencies via composer
      shell: bash
      run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader
